{% extends "base.html" %}
{% block title %}ورود کارمند{% endblock %}
{% block content %}

<section class="card login-card" style="max-width:420px;margin:0 auto">
    <h2>ورود کارکنان منابع انسانی</h2>
    <div class="muted" style="margin-bottom:18px">ورود با نام‌کاربری و رمز عبور.</div>

    <div class="grid">
        <div class="form-group">
            <label for="username">نام کاربری</label>
            <input type="text" id="username" class="input" autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">رمز عبور</label>
            <input type="password" id="password" class="input" autocomplete="current-password">
        </div>
        <div class="field-error" data-error-for="login" role="alert" tabindex="-1"></div>
        <button type="button" id="login-button" class="btn primary" style="width:100%">ورود</button>
    </div>
</section>

{% endblock %}
{% block extra_scripts %}
<script type="module" src="/static/js/staff_login.js"></script>
{% endblock %}
